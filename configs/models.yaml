gemini-2.5-flash:
  model:
    provider: google
    model_name: gemini-2.5-flash
    api_key_env: GOOGLE_API_KEY
    max_tokens: 4096
    timeout_sec: 120
    raise_on_api_error: true
  prompt:
    explanation_max_words: 20
  runtime:
    retry_times: 5
    sleep_between_retries_sec: 10
    checkpoint_every_n: 10
    write_checkpoint_reports: true
    resume_from_checkpoint: true
    resume_success_only: true
gemini-2.5-pro:
  model:
    provider: google
    model_name: gemini-2.5-pro
    api_key_env: GOOGLE_API_KEY
    max_tokens: 4096
    timeout_sec: 120
    raise_on_api_error: true
  prompt:
    explanation_max_words: 20
